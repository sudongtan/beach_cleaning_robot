# World model (packages/world_model). Basket load cap: config/robot_limits.yaml basket_load_max_kg.
world_model:
  dedup_radius_m: 0.55           # a detection this close to a known item of the same class is that item (C1: EKF jitter, notes C1-C4)
  detection_tf_wait_s: 0.3       # sim s a detection waits for map <- camera at its stamp, then it is dropped (C1)
  ignore_near_gripper_m: 0.2     # detections this close to the gripper TCP are the held item, not a new one
  ignore_outside_geofence: true  # detections outside the scene's geofence are not added
  coverage_resolution_m: 0.5
  max_items_per_compartment: 1   # B5b: one item, at the floor's centre (grasping store.placement); was 5 (33 x 14.5 cm compartments)
  default_item_mass_kg: 0.2      # mass when the item isn't known (heaviest item: the 330 ml glass bottle)
  item_classes: [trash, distractor]   # /detections classes that become items (the bins don't, B4)
  # coverage with a planar localization (robot_localization two_d_mode: base_link at z 0, B4): the camera's
  # height is taken as the terrain under the robot + this (robot_limits.yaml body_heights_m: 0.285 loaded)
  planar_base_height_m: 0.30
