# Task (packages/task): search pattern and state machine.
task:
  search:
    # Lawnmower lanes parallel to the shore (x). Lane spacing = camera footprint width at
    # view_distance_m ahead (2 * d * tan(hfov / 2), hfov from config/sensors.yaml) * (1 - overlap).
    view_distance_m: 2.0
    overlap: 0.2
    edge_margin_m: 0.5         # lanes and waypoints stay this far inside the geofence
    waypoint_spacing_m: 5.0    # waypoints along a lane (progress checks; lethal ones are dropped)
  fsm:
    rate_hz: 10.0
    standoff_m: 0.7              # APPROACH step 1: navigation goal this far from the item, facing it
    # Rim height of each bin (map z): `terrain` = the bin's ground height under a bin_ground_radius_m
    # footprint (sim/common/terrain.py ground_z 'min', as the simulator spawns it) + the model's rim;
    # `fixed` = the model's rim above map z 0, ignoring the sand under the bin (baseline A3: up to
    # 0.24 m too low on the benchmark scenes).
    bin_rim: terrain
    bin_ground_radius_m: 0.3
    bin_standoff_m: 1.2          # navigation goal this far in front of a bin centre (clear of its lethal cells)
    # then straight in until base_link is this far from the bin centre. Set by the arm, not the head:
    # in `rest` the wrist is 0.43 m ahead of base_link and the rest -> up move sweeps it to 0.52 m,
    # so the near wall (0.30 m from the centre) must be >= 0.57 m ahead (A2b: at 0.7 m the arm hit
    # the bin and tipped the robot over). Checked by sim/common/tests/test_cross_phase.py.
    bin_place_distance_m: 0.87
    # From one bin to the other (they stand side by side; A3: 3 of 7 falls on the walk between them):
    # `step` = straight sideways (vy, heading held) from one place pose to the other, then PLACE;
    # `walk` = back out to bin_standoff_m, then a Nav2 goal (baseline A3). The arm can't reach into
    # both bins from one pose (B2 check, notes/logs/B1-B3.md), so there is no one-stop option.
    bin_placement: step
    bin_step:
      max_vy: 0.10               # as the final approach (its gain, max_vx, max_wz, max_accel, tolerance)
      along_tolerance_m: 0.10    # step only to a bin beside this one: same yaw (within 0.1 rad), offset
      max_lateral_m: 1.5         # along the bin's x below along_tolerance_m, sideways at most max_lateral_m
                                 # no progress (final_approach progress_*) -> back out and walk (Nav2)
    bin_leave_timeout_s: 20.0    # after placing, back straight out to bin_standoff_m (Nav2 won't start facing
                                 # the bin); give up after this long and let Nav2 try anyway
    final_approach:              # APPROACH step 2: small /cmd_vel_nav steps until the item is in reach
      target_x_m: 0.49           # item centre ahead of base_link (middle of the grasp envelope)
      tolerance_m: 0.03          # stop within this of target_x and of y = 0, not at the envelope's edge
      gain: 0.8
      max_vx: 0.15
      max_vy: 0.10
      max_wz: 0.3
      # the task's own commands change at most this fast (as Nav2's velocity smoother): a step in
      # the turn rate tips the robot (A2b falls)
      max_accel: [0.3, 0.3, 0.5]     # vx, vy (m/s^2), wz (rad/s^2)
      # B4: the slowest planar speed of the task's own moves (final approaches, bin step, back-out,
      # escape): slower non-zero commands are scaled up to it, same direction. Upstream of the safety
      # supervisor, which still scales and stops them. Per walking controller (locomotion:=), else 0 = off.
      # robot_lab barely moves below ~0.05 m/s and not at all sideways (its training zeroes planar
      # commands <= 0.2 m/s; notes/logs/B4.md --tiny); 0.08 tracked as 0.09 in G2 sweep 2.
      min_speed_by_locomotion_mps: {legubiao_robot_lab: 0.08}
      settle_s: 1.0              # stand still this long before the arm moves
      progress_timeout_s: 10.0   # give up (no_progress) if the distance to the item hasn't shrunk ...
      progress_min_m: 0.05       # ... by this much in progress_timeout_s; the same rule ends a bin step, a bin
                                 # final approach (Nav2 again; after nav_retries its items stay in the basket, B4)
                                 # and an escape step (escape.progress_min_rad)
    # B3: Nav2's controller refuses every command while the footprint's outline touches a lethal cell, at the
    # current pose or projected 1 s ahead, rotations included (RPP isCollisionImminent; costmap footprintCost =
    # outline only; A3 stalls: seeds 0, 4, 6, dev 101). RPP turns on the spot towards its path first, so the
    # robot must be able to turn freely. The task's own moves (final approaches, bin step, back-out) don't use
    # the map and can end where it can't. `escape` = before a Nav2 goal, if the outline (+ margin) isn't clear
    # at every heading ("turn-free"), get to a turn-free pose first; `none` = baseline A3 (send the goal anyway).
    nav_start: escape
    escape:
      trail_step_m: 0.05         # the own moves are recorded as poses this far apart
      max_m: 2.0                 # move at most this far in all (then Nav2 tries anyway)
      # 1. retrace the own moves (newest first, each pose's heading); 2. else straight along the current heading,
      # forward or back, to the nearest turn-free pose within straight_max_m with the outline clear all the way;
      # 3. else (e.g. b2_bins seed 8, Nav2 itself stopped in a corridor) turn on the spot to the nearest heading
      # with a clear outline (turn_step_deg steps, up to max_turn_deg each way), then back straight out back_m
      straight_max_m: 1.5
      turn_step_deg: 15          # also the heading step of the turn-free check
      max_turn_deg: 90
      back_m: 0.3
      heading_tol_rad: 0.05      # a target pose counts as reached within tolerance_m and this heading error
      # B4: an escape step that gets neither closer (final_approach progress_min_m) nor turns towards its heading
      # by this much in final_approach progress_timeout_s ends the escape (then Nav2 tries anyway, as after max_m):
      # robot_lab stood still on small backward / sideways steps for > 200 s (b4_robot_lab s0, s1)
      progress_min_rad: 0.05
      outline_step_m: 0.05       # footprint outline sampled this finely (the local costmap's cells)
      outline_margin_m: 0.05     # outline checked this much larger than Nav2's footprint: the local costmap (0.05 m,
                                 # resampled from the 0.25 m /map) saw a lethal cell where the exact outline didn't (B3 probe)
    grasp_retries: 3             # failed picks per item before it is skipped
    nav_retries: 2               # failed navigation goals per target before it is skipped
    item_timeout_s: 180.0        # no progress on one item for this long -> skipped (no_progress)
    nav_timeout_s: 120.0         # one navigation goal
    fall_tilt_deg: 30.0          # body tilt beyond this = fallen: stop everything, end the run (FELL)
