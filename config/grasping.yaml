# Grasping (packages/grasping). Robot variant, jaw margin and bin-drop geometry: config/robot_limits.yaml.
grasping:
  # Pick (attach mode): jaw tips hover above the item's top without contact (Gazebo's
  # DetachableJoint can't attach while touching), then attach, close, lift.
  hover_above_item_m: 0.015
  pregrasp_above_m: 0.10        # approach from this far above the hover point
  lift_above_m: 0.20            # lift the jaw tips this far above the hover point
  approach_max_tilt_deg: 10     # gripper within this of straight down for picks
  # Reach envelope for picks, item centre in base_link (the robot walks until the item is
  # inside, then stands still). Physics-grasp tests used x = 0.48 m.
  reach_x_m: [0.42, 0.56]
  reach_y_max_m: 0.10
  # IK (numerical, Pinocchio): random restarts and convergence
  ik_restarts: 30
  ik_tolerance_m: 0.005
  # Item height for the hover point when the pick goal's size is unknown (all zero): the
  # tallest item (7.5 cm, cross-phase limit), so the jaws never touch it before attaching.
  assumed_item_height_m: 0.075
  # After a pick the item is held in front of the head camera for /classify (A1c: item hangs
  # in full view below the jaws, seen edge-on). Order as arm_controller joints.
  # B4: the A1c IK pose [.., -3.099, -1.687, -0.089] flipped (forearm_roll + pi, wrist_angle negated):
  # same jaw tips and approach axis, gripper turned by pi about its (symmetric) axis, so the item is
  # seen mirrored. Show -> up now turns forearm_roll / wrist_angle by < 0.1 rad instead of 3.1 / 3.3 rad
  # (that move's wrist overshoot after a safety stop was the rerun s3 arm violation, notes B4).
  show_pose: [0.0, 1.685, -1.78, 0.043, 1.687, -0.089]
  # Taking an item out of a basket compartment for the bin (attach mode): jaws closed and along
  # the compartment (the 18 cm gripper bar doesn't fit across a 15 cm compartment), tips at
  # hover_above_item_m above the item, then straight up until the item is rim_clearance_m above
  # the rim. Over the bin the release point is raised by the item's height for the same reason.
  unload:
    wall_clearance_m: 0.01      # gripper bar to the compartment walls
    rim_clearance_m: 0.03       # item bottom above the rim before the arm swings to the bin
    above_max_tilt_deg: 25      # the lift point is high and behind the arm: vertical (10 deg) only reaches ~0.36 m
    # IK stays within this of the over-compartment pose, per joint in arm_controller order
    # (waist and forearm roll; .inf = free): no flipped solutions, no half-turn swings
    joint_spread_rad: [1.0, .inf, .inf, 1.0, .inf, .inf]
  # Storing in the basket (attach mode): the item's long side along the compartment, at the lowest of
  # slots_x x slots_y spots (ground truth of the items already there, like the unload), released
  # drop_gap_m above what lies there. One fixed release point stacked the items up to the rim and
  # walking shook the top ones out (a2b_full1; store_drop_test.py). The jaws stay closed (the item
  # hangs below them); the gripper bar stays bar_clearance_m above the rim. Footprints may overlap by
  # overlap_tolerance_m (a bottle and a tin side by side fill a compartment); an item whose top would be
  # less than top_below_rim_m below the rim is refused (compartment_full: the task puts it back).
  store: {slots_x: 3, slots_y: 2, wall_clearance_m: 0.005, drop_gap_m: 0.01, bar_clearance_m: 0.01,
          overlap_tolerance_m: 0.01, top_below_rim_m: 0.01}
  # Release over the bin: IK stays within this of `up` (waist, forearm roll, wrist rotate). Unbounded,
  # IK chose a flipped pose (waist 3.14); every move to it swung the arm half a turn with the item
  # attached and tipped the robot over (A2b a2b_bin4).
  release_joint_spread_rad: [1.0, .inf, .inf, 1.0, .inf, 1.0]
  move_time_s: 2.5              # duration of each arm move
  finger_time_s: 1.0
  # How a running arm move stops when /safety/state leaves ok: hold_reference preempts it with a goal to
  # the controller's reference position at that instant (reached after stop_hold_s); cancel cancels the
  # goal, and the controller then holds the measured position, so a joint lagging its reference under
  # load gives way by the lag (B4 question 9, b4_robot_lab s5; sim/gazebo/tools/cancel_test.py).
  safety_stop: hold_reference   # hold_reference | cancel
  stop_hold_s: 0.1
  safety_hold_timeout_s: 120.0  # give up a pick/place if /safety/state stays not-ok this long
