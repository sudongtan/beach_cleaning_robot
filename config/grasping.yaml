# Grasping (packages/grasping). Robot variant, jaw margin and bin-drop geometry: config/robot_limits.yaml.
grasping:
  # Pick (attach mode): jaw tips hover above the item's top without contact (Gazebo's
  # DetachableJoint can't attach while touching), then attach, close, lift.
  hover_above_item_m: 0.015
  pregrasp_above_m: 0.10        # approach from this far above the hover point
  lift_above_m: 0.20            # lift the jaw tips this far above the hover point
  approach_max_tilt_deg: 10     # gripper within this of straight down for picks
  # Pick IK stays within this of the pose the arm comes from (hover near `up`, above and lift near hover;
  # waist, forearm roll, wrist rotate; null = unbounded): unbounded, lift turned the forearm roll 2 pi
  # (or the waist pi) from hover, a 21 s spin at the speed cap with the item hanging, 0.14 rad behind.
  pick_joint_spread_rad: [1.0, .inf, .inf, 1.0, .inf, 1.0]
  # Reach envelope for picks, item centre in base_link (the robot walks until the item is
  # inside, then stands still). Physics-grasp tests used x = 0.48 m.
  reach_x_m: [0.42, 0.56]
  reach_y_max_m: 0.10
  # IK (numerical, Pinocchio): random restarts and convergence
  ik_restarts: 30
  ik_tolerance_m: 0.005
  # Item height for the hover point when the pick goal's size is unknown (all zero): the
  # tallest item (7.5 cm, cross-phase limit), so the jaws never touch it before attaching.
  assumed_item_height_m: 0.075
  # After a pick the item is held in front of the head camera for /classify (A1c: item hangs
  # in full view below the jaws, seen edge-on). Order as arm_controller joints.
  # B4: the A1c IK pose [.., -3.099, -1.687, -0.089] flipped (forearm_roll + pi, wrist_angle negated):
  # same jaw tips and approach axis, gripper turned by pi about its (symmetric) axis, so the item is
  # seen mirrored. Show -> up now turns forearm_roll / wrist_angle by < 0.1 rad instead of 3.1 / 3.3 rad
  # (that move's wrist overshoot after a safety stop was the rerun s3 arm violation, notes B4).
  show_pose: [0.0, 1.685, -1.78, 0.043, 1.687, -0.089]
  # Taking an item out of a basket compartment for the bin (attach mode): jaws closed and along
  # the compartment (the 18 cm gripper bar doesn't fit across a 15 cm compartment), tips at
  # hover_above_item_m above the item, then straight up until the item is rim_clearance_m above
  # the rim. Over the bin the release point is raised by the item's height for the same reason.
  unload:
    wall_clearance_m: 0.01      # gripper bar to the compartment walls
    rim_clearance_m: 0.03       # item bottom above the rim before the arm swings to the bin
    above_max_tilt_deg: 25      # the lift point is high and behind the arm: vertical (10 deg) only reaches ~0.36 m
    # IK stays within this of the over-compartment pose, per joint in arm_controller order
    # (waist and forearm roll; .inf = free): no flipped solutions, no half-turn swings
    joint_spread_rad: [1.0, .inf, .inf, 1.0, .inf, .inf]
    # IK points between hover and above, re-aimed so the item centre stays over its spot (0 = off). The store's
    # edge spots (store.lower_vias, B5.4 run 3) cut unload success to 38.9 % in sweep 7: the joint line swung
    # the gripper and the held item into the walls. 12 second-store tasks: 148/384 (off) -> 294/384 (2).
    lift_vias: 2
    # B5b: the lift re-aims the item centre this far toward the compartment's middle (clipped there; 0 = straight up
    # over the item, c076fa5). An item the walk pushed against a wall (S1: up to 4.3 cm in y) starts its unload
    # below clearance_m; straight up, the IK's sub-mm drift toward the wall failed the separating-contacts rule.
    # Offline (wall_lift2.py, 2 compartments x 3 types, item 0.1 and 1 mm from either wall, 24 cases): first plan
    # 0/24 -> 22/24, with restarts 4/24 -> 24/24 (0 -> 0.01).
    lift_toward_middle_m: 0.01
  # Storing in the basket (attach mode): the item's long side along the compartment, at the lowest of
  # slots_x x slots_y spots (ground truth of the items already there, like the unload), released
  # drop_gap_m above what lies there. One fixed release point stacked the items up to the rim and
  # walking shook the top ones out (a2b_full1; store_drop_test.py). The jaws stay closed (the item
  # hangs below them); the gripper bar stays bar_clearance_m above the rim. Footprints may overlap by
  # overlap_tolerance_m (a bottle and a tin side by side fill a compartment); an item whose top would be
  # less than top_below_rim_m below the rim is refused (compartment_full: the task puts it back).
  # B5.3: slots 4 x 3 (was 3 x 2: with the collision check the jar's slot beside a flat bottle was rejected
  # and no other spot was left; the jar now fits in the middle row). With odd slots_y the middle row is
  # tried last (a fallback): ranked by distance it centred items and a full compartment fitted fewer.
  # bar_box_exact: the bar's underside from its collision box corners; false took the box centre (12.5 mm
  # higher than the underside), so a thin item's store put the 18 cm bar 2-4 mm below the rim, across the
  # side wall and the divider (B5.3 sweep 2, cigarette_pack).
  # B5.4 (run lower_b5a: the bottle's edge slots, wall_clearance_m = collision.clearance_m, all touched the
  # wall at 4.1-5.0 mm, the bottle went to the centre and left the jar no spot): slots_x 8 and fill_corner
  # [1, 1] (fill from the +x, +y corner; null = nearest the centre first), so a long item lies at one end
  # and leaves a free end; wall_retry_m: an edge spot the check rejected at the basket is tried once more
  # that much further in, before the next spot along (B5.4 run 2: tried after every plain spot, the bottle
  # moved 3 cm in instead of 5 mm and left the jar 3 mm of slack; null = off); seeded_ik: the pre-aim solve (only finds the item's offset for the
  # re-aim) takes one try from its seed first (all ik_restarts if it fails); with the check on, a spot is first
  # checked with a one-try seeded above, and only a spot that passes gets the full above solve and the real
  # check (a seeded above alone tilted long items to 0-5 mm over the rim). 30 tries x 3 solves x the extra
  # spots made store plans 6.5 s p95; false = off. inside_walls: a spot where the held item's
  # footprint at the release pose reaches past a wall is skipped (a tilted IK solve at an edge spot; false = off).
  # B5.4 run 3 (the jar refused as compartment_full beside a flat bottle): the joint-space line from above to
  # release swung the held jar 19-27 mm sideways and tilted it (bbox 70 -> 88 mm tall), so every edge spot
  # touched a wall top near the rim. lower_vias: IK points spaced evenly between above and release (0 = off),
  # each and above re-aimed on the item centre; the arm goes down through them and back up the same way
  # (with 2 the item stayed within 7 mm of the spot in the replay); wall_retries: how often an edge spot
  # is retried further in (1 left the jar's -x end spot at 10 mm in, still 4 mm from the wall; 3 reach 15 mm).
  # support_margin_m: a spot on top of items is used only when the item's centre and this far either side of it
  # along the compartment lie over an item of that pile height (null = off). devb5 s8: a 0.23 m bottle stacked
  # over the end of a 0.12 m one tipped (vertical extent 0.14 m, unload above out of reach at 0.135 m) and the
  # item below could not be unloaded past it: the compartment stayed full for the rest of the run.
  # check_unload: a spot is used only if the unload from it (as it will have landed) plans and passes the
  # collision check (false = off). devb5b s2: a cube in a corner and a wide item stacked on another stored
  # fine, but neither (nor the item under the stack) could be unloaded: the compartment stayed full. With
  # task unload_order last_first the layout at an unload is the one checked when that item was stored.
  # B5b (devb5c: every compartment blocked: the sim lands items 5-15 mm off the planned spot, packed spots had
  # 0-5 mm of slack): placement centre: one spot, the middle of the compartment floor; if it fails any check
  # the item is refused compartment_full and the task puts it back (grid = the slot grid above). max_items:
  # compartment_full once that many items lie in the compartment, from ground truth, whatever the task counts
  # (null = off; world_model.yaml max_items_per_compartment is the task's limit). check_unload_margin: the
  # store-time unload check also with the item landed landing_margin_m off in x, y and both (9 checks; a
  # number or [x, y]; false = off). landing_margin_m: B5b S1 p95 of |drop + walk error| per axis over 40 samples
  # (store_drop_test.py --one, scene 101; the walk pushes items up to 4.3 cm in +y, results/store_drop/b5b_s1.json).
  # margin_clip_walls: an offset beyond the item's free space to a wall is cut to touching it (false = not cut).
  store: {placement: centre, max_items: 1, check_unload_margin: true, landing_margin_m: [0.015, 0.039], margin_clip_walls: true,
          slots_x: 8, slots_y: 3, wall_clearance_m: 0.005, wall_retry_m: 0.005, wall_retries: 3, lower_vias: 2, fill_corner: [1, 1], seeded_ik: true, inside_walls: true,
          drop_gap_m: 0.01, bar_clearance_m: 0.01, bar_box_exact: true, overlap_tolerance_m: 0.01, top_below_rim_m: 0.01,
          support_margin_m: 0.03, check_unload: true}
  # Wrist turn of the store and unload plans (the jaws open the same way every half turn; a square
  # item fits every quarter turn). nearest: the turn nearest the previous pose (over -> release ->
  # above); any: whichever float noise picks. With any, the held bottle turned ~pi while lowered into
  # the 14 cm compartment, through its walls (c1_axis s3 arm-rule violation).
  wrist_branch: nearest         # nearest | any
  # Release over the bin: IK stays within this of `up` (waist, forearm roll, wrist rotate). Unbounded,
  # IK chose a flipped pose (waist 3.14); every move to it swung the arm half a turn with the item
  # attached and tipped the robot over (A2b a2b_bin4).
  release_joint_spread_rad: [1.0, .inf, .inf, 1.0, .inf, 1.0]
  # Collision check of every planned arm move (B5, grasping/collision.py): the joint-space line of each move,
  # sampled at most step_rad per joint, keeps clearance_m between the arm, the held item, the robot body,
  # the basket, the items in it and the goal bin (ground-truth boxes). A failing plan takes the next store
  # slot / an IK restart / a lower bin release, else it is refused. clearance_m stays below store.drop_gap_m
  # and hover_above_item_m (cross-phase test). null = off (the plans of 9ac4816). restarts: pick / unload
  # plans solved again after a collision (each ~0.3-0.6 s of IK; ik_restarts = 30 took up to 40 s, B5.3).
  # refine_m: where a pair comes within clearance_m + refine_m at a sample, both sample intervals beside it
  # are checked every refine_step_rad (B5.3 sweep 2: 7 of 13972 unload lifts dipped to 4.8-5.0 mm between
  # two step_rad samples; null = no refinement); refine_step_rad 0.0025 (was 0.005: sweep 4, one unload lift
  # 4.995-5.0 mm between two fine samples). check_first: phases checked before the rest of a plan (same
  # verdict; a store's lower move fails most, so the long up -> above move is skipped then; null = in order).
  collision: {clearance_m: 0.005, step_rad: 0.02, refine_m: 0.002, refine_step_rad: 0.0025, restarts: 4, check_first: [lower]}
  move_time_s: 2.5              # duration of each arm move (at least; see max_joint_speed_radps)
  # C1 item 24: a move stopped for safety keeps going ~0.03 rad per 1 rad/s of joint speed (devtrace: stop
  # latency + the hold spline starting at the measured velocity); with 2.5 s per move big swings ran at
  # 1-1.7 rad/s against the 0.03 rad arm rule. Longer moves keep every joint at or below this (0 = off).
  max_joint_speed_radps: 0.3     # devcap (0.5): 0.024 rad after a stop, ~0.045 rad per rad/s
  finger_time_s: 1.0
  # How a running arm move stops when /safety/state leaves ok: hold_reference preempts it with a goal to
  # the controller's reference position at that instant (reached after stop_hold_s); cancel cancels the
  # goal, and the controller then holds the measured position, so a joint lagging its reference under
  # load gives way by the lag (B4 question 9, b4_robot_lab s5; sim/gazebo/tools/cancel_test.py).
  safety_stop: hold_reference   # hold_reference | cancel
  stop_hold_s: 0.1
  safety_hold_timeout_s: 120.0  # give up a pick/place if /safety/state stays not-ok this long
