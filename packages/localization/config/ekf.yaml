navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: 0.0   # the simulator has no magnetic model; the IMU heading is ENU
    yaw_offset: 0.0                     # measured: /imu yaw = ground-truth yaw (0 = facing east)
    zero_altitude: true
    broadcast_cartesian_transform: false
    publish_filtered_gps: false
    use_odometry_yaw: true              # as the tutorial: heading from the global EKF (fuses the IMU yaw)
    use_local_cartesian: true
    wait_for_datum: true                # datum: [lat, lon, heading] set by the launch from bench/scenes.yaml geo
