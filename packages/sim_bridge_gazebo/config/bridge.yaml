# ros_gz_bridge: Gazebo topics -> the architecture topics (notes/architecture.md).
# Frame ids come from the sensors' <gz_frame_id> (beach_robot_gazebo.urdf.xacro).
- ros_topic_name: /clock     # every physics step (1 kHz); clock_throttle makes /sim/clock_throttled
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /camera/rgb
  gz_topic_name: /camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /camera/depth
  gz_topic_name: /camera/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /camera/info
  gz_topic_name: /camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
- ros_topic_name: /imu
  gz_topic_name: /nav_imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
# raw fix without covariance; gnss_relay republishes it as /gnss/fix
- ros_topic_name: /gnss/fix_raw
  gz_topic_name: /navsat
  ros_type_name: sensor_msgs/msg/NavSatFix
  gz_type_name: gz.msgs.NavSat
  direction: GZ_TO_ROS
- ros_topic_name: /sim/ground_truth/pose
  gz_topic_name: /sim/gz/ground_truth/odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
