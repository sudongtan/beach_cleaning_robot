  rock_small:
    class: rock
    mass: 0.6
    mesh: meshes/rock_small.obj
    color: [0.45, 0.43, 0.40, 1.0]
    collision:
      - {type: box, size: [0.12, 0.09, 0.06], pose: [0, 0, 0.03, 0, 0, 0]}
    footprint_radius: 0.09
  rock_medium:
    class: rock
    mass: 3.0
    mesh: meshes/rock_medium.obj
    color: [0.38, 0.36, 0.34, 1.0]
    collision:
      - {type: box, size: [0.24, 0.18, 0.12], pose: [0, 0, 0.06, 0, 0, 0]}
