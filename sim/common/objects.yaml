# Static models: bins and landmarks never move.
bins:
  # revisit after A0: rim height must suit the arm's reach when dropping items.
  bin_recyclable:
    class: bin_recyclable
    bin_id: recyclable
    mesh: meshes/bin.obj
    color: [0.10, 0.35, 0.80, 1.0]
    collision:   # open top: floor + 4 walls, outer 0.60 x 0.45 x 0.50
      - {type: box, size: [0.60, 0.45, 0.02], pose: [0, 0, 0.01, 0, 0, 0]}
      - {type: box, size: [0.60, 0.02, 0.50], pose: [0, 0.215, 0.25, 0, 0, 0]}
      - {type: box, size: [0.60, 0.02, 0.50], pose: [0, -0.215, 0.25, 0, 0, 0]}
      - {type: box, size: [0.02, 0.41, 0.50], pose: [0.29, 0, 0.25, 0, 0, 0]}
      - {type: box, size: [0.02, 0.41, 0.50], pose: [-0.29, 0, 0.25, 0, 0, 0]}
    footprint_radius: 0.40
  bin_residual:
    class: bin_residual
    bin_id: residual
    mesh: meshes/bin.obj
    color: [0.25, 0.25, 0.25, 1.0]
    collision:
      - {type: box, size: [0.60, 0.45, 0.02], pose: [0, 0, 0.01, 0, 0, 0]}
      - {type: box, size: [0.60, 0.02, 0.50], pose: [0, 0.215, 0.25, 0, 0, 0]}
      - {type: box, size: [0.60, 0.02, 0.50], pose: [0, -0.215, 0.25, 0, 0, 0]}
      - {type: box, size: [0.02, 0.41, 0.50], pose: [0.29, 0, 0.25, 0, 0, 0]}
      - {type: box, size: [0.02, 0.41, 0.50], pose: [-0.29, 0, 0.25, 0, 0, 0]}
    footprint_radius: 0.40

landmarks:
  lifeguard_tower:
    class: lifeguard_tower
    mesh: meshes/lifeguard_tower.obj
    color: [0.92, 0.92, 0.90, 1.0]
    collision:   # 4 legs + cabin, footprint 2.0 x 2.0, cabin floor at 1.8 m
      - {type: box, size: [0.12, 0.12, 1.8], pose: [0.9, 0.9, 0.9, 0, 0, 0]}
      - {type: box, size: [0.12, 0.12, 1.8], pose: [0.9, -0.9, 0.9, 0, 0, 0]}
      - {type: box, size: [0.12, 0.12, 1.8], pose: [-0.9, 0.9, 0.9, 0, 0, 0]}
      - {type: box, size: [0.12, 0.12, 1.8], pose: [-0.9, -0.9, 0.9, 0, 0, 0]}
      - {type: box, size: [2.0, 2.0, 1.2], pose: [0, 0, 2.4, 0, 0, 0]}
      - {type: box, size: [0.55, 0.10, 2.0], pose: [0, 1.6, 1.0, 0, 0, 0]}    # ladder
    footprint_radius: 1.8
  fence_post:
    class: fence_post
    mesh: meshes/fence_post.obj
    color: [0.50, 0.38, 0.25, 1.0]
    collision:
      - {type: cylinder, radius: 0.05, length: 1.0, pose: [0, 0, 0.5, 0, 0, 0]}
    footprint_radius: 0.15

person:
  class: person
  # Gazebo actor animation, downloaded from Gazebo Fuel on first run (see ASSETS.md).
  gazebo_skin: https://fuel.gazebosim.org/1.0/Mingfei/models/actor/tip/files/meshes/walk.dae
  hip_height: 1.0     # z offset of the walk.dae root above the ground, as in gz-sim's actor.sdf
  footprint_radius: 0.4
