# Ranges the scene generator samples from. Changing anything here changes
# bench/scenes.yaml, i.e. the benchmark: regenerate and log it in decisions.md.

area_size: [25.0, 20.0]          # x (east) by y (north), metres; sea to the south (decisions 2026-11-02)

geo:                             # world origin (south-west corner of the area)
  # Approximate point on Barceloneta beach, Barcelona (Mediterranean: small
  # tides, so a fixed waterline is plausible).
  latitude_deg: 41.3784
  longitude_deg: 2.1925
  elevation_m: 0.0

terrain:
  z_min: -1.0                    # heightmap range, fixed for all scenes
  z_max: 6.0
  heightmap:
    pixels: 257                  # 2^n + 1
    size: 64.0                   # square, covers the area plus margins and sea
  waterline_y: [3.0, 5.0]
  wet_zone_width: [4.0, 6.0]
  wet_zone_height: 0.03          # flat wet zone, just above the water plane (z = 0)
  beach_slope: [0.015, 0.03]     # dry beach rises inland (rise / run)
  roughness:                     # sum of sines on dry sand
    components: 5
    amplitude: [0.004, 0.01]     # each component adds at most 2*pi*A/lambda of slope (~0.9 deg)
    wavelength: [4.0, 9.0]
  inner_dunes:                   # gentle hummocks inside the cleaning area
    count: [1, 2]
    height: [0.15, 0.35]
    sigma: [3.0, 4.5]            # max slope ~0.6 * height / sigma, ~4 deg at worst
    # centre inland of the wet zone by 2.5 sigma plus this, so a dune has
    # flattened out (< 5 % of its height) before the wet/dry boundary
    extra_y: [0.0, 6.0]
  # After sampling, all dunes are scaled down (x0.9 steps) until no point of the geofence is
  # steeper than config/terrain.yaml max_slope_deg (the robot's limit).
  back_dunes:                    # steep dune ridge behind the fence (scenery, not traversable)
    count: [3, 5]
    height: [1.2, 2.2]
    sigma: [2.5, 3.0]            # across the beach; 2x along it
    y_behind_area: [5.0, 9.0]    # centre this far north of the area's back edge
  friction:                      # Coulomb mu per zone
    dry_sand: 0.6
    wet_sand: 0.8

counts:
  trash: [8, 15]
  distractors: [6, 12]
  fence_post_spacing: 3.0

placement:
  clearance_m: 0.3               # extra gap between object footprints
  keepout_m: 2.0                 # free radius around bins, tower and robot start
  bin_offset_y: [2.0, 6.0]       # first bin this far inland of the wet zone
  tower_edge_margin_m: 6.0       # lifeguard tower at least this far from the east / west edges
  half_buried_probability: 0.25
  bury_fraction: [0.3, 0.5]      # share of the visual height below the surface
  seaweed_wet_zone_probability: 0.7

person:
  # Present in scenes with an odd seed, so exactly half of seeds 0-9 have one.
  speed: [0.9, 1.3]              # m/s
  start_x_outside: 5.0           # path starts and turns this far outside the area
  clearance_m: 1.5               # min distance from bins and tower
  y_from_waterline_m: 2.0        # path turning points from this far inland of the waterline to 1 m before the fence

# Small scenes for quick integration checks (seeds >= 100). NOT benchmark scenes: the benchmark
# is seeds 0-9 (notes/benchmark.md). Each key below replaces the same key above.
dev_scenes:
  seeds: [101]                   # odd: has the person
  overrides:
    area_size: [15.0, 12.0]
    terrain:
      waterline_y: [2.0, 3.0]
      wet_zone_width: [2.5, 3.5]
      inner_dunes: {count: [0, 0]}
    counts: {trash: [4, 6], distractors: [3, 5]}
    placement: {bin_offset_y: [1.5, 2.5], tower_edge_margin_m: 4.0}
    person: {y_from_waterline_m: 0.5}   # on the wet sand: bins and tower fill the dry strip
